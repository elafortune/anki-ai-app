<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkiAI Ultra - Extraction Exhaustive</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [inputText, setInputText] = useState('');
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [decks, setDecks] = useState(() => JSON.parse(localStorage.getItem('anki_decks_v3') || '[]'));
            const [generatedCards, setGeneratedCards] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [view, setView] = useState('input');
            const [cardIndex, setCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [currentDeck, setCurrentDeck] = useState(null);

            useEffect(() => {
                localStorage.setItem('anki_decks_v3', JSON.stringify(decks));
            }, [decks]);

            useEffect(() => {
                localStorage.setItem('gemini_key', apiKey);
            }, [apiKey]);

            const generateFlashcards = async () => {
                if (!inputText.trim() || !apiKey) {
                    alert("Veuillez saisir du texte et votre clé API.");
                    return;
                }
                setIsGenerating(true);

                const systemPrompt = `Tu es un extracteur de connaissances ultra-précis. 
                Ta mission est d'être EXHAUSTIF. Pour chaque concept, fonction Python, paramètre ou formule mathématique trouvé, tu DOIS créer une flashcard. 
                S'il y a 30 points clés, génère 30 cartes. 
                Règles :
                - Code Python : une carte par fonction + une carte par paramètre important.
                - Maths IA : extraire toutes les formules en LaTeX ($...$).
                - Architecture : expliquer le "pourquoi" de chaque composant.
                Format JSON : [{"question": "...", "answer": "...", "type": "code|math|concept"}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: inputText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const cards = JSON.parse(data.candidates[0].content.parts[0].text);
                    setGeneratedCards(cards);
                    setView('preview');
                } catch (error) {
                    alert("Erreur lors de la génération. Vérifiez votre clé API.");
                    console.error(error);
                } finally {
                    setIsGenerating(false);
                }
            };

            const saveDeck = () => {
                const title = prompt("Nom de ce pack de connaissance :");
                if (!title) return;
                setDecks([...decks, { id: Date.now(), title, cards: generatedCards, date: new Date().toLocaleDateString() }]);
                setView('library');
                setInputText('');
            };

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2" onClick={() => setView('input')} style={{cursor:'pointer'}}>
                            <div className="bg-indigo-600 p-1.5 rounded-lg text-white"><i data-lucide="zap"></i></div>
                            <h1 className="font-black text-xl tracking-tighter">AnkiAI <span className="text-indigo-600">Ultra</span></h1>
                        </div>
                        <div className="flex gap-4 items-center">
                            <input 
                                type="password" 
                                placeholder="Clé API Gemini" 
                                className="text-xs p-2 border rounded-lg bg-slate-50 w-32 focus:w-64 transition-all"
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                            />
                            <button onClick={() => setView('library')} className="font-bold text-sm text-slate-600 hover:text-indigo-600">Decks ({decks.length})</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-6 mt-4">
                        {view === 'input' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-[2rem] p-8 border border-slate-200 shadow-sm">
                                    <h2 className="text-xl font-black mb-4">Source de connaissance</h2>
                                    <textarea 
                                        className="w-full h-96 p-6 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-sm leading-relaxed"
                                        placeholder="Collez ici tout votre texte ou code... L'IA extraira TOUT sans exception."
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                    />
                                    <button 
                                        onClick={generateFlashcards}
                                        disabled={isGenerating}
                                        className="w-full mt-6 bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center justify-center gap-3"
                                    >
                                        {isGenerating ? <div className="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div> : <i data-lucide="sparkles"></i>}
                                        Extraction Massive par IA
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'preview' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-3xl font-black">Cartes Extraites</h2>
                                        <p className="text-slate-500 font-bold uppercase text-[10px] tracking-widest mt-1 text-indigo-600">{generatedCards.length} cartes générées</p>
                                    </div>
                                    <button onClick={saveDeck} className="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-emerald-100">Enregistrer</button>
                                </div>
                                <div className="grid gap-4">
                                    {generatedCards.map((c, i) => (
                                        <div key={i} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row gap-4 border-l-4 border-l-indigo-500">
                                            <div className="md:w-1/2 font-bold text-slate-800 tracking-tight">Q: {c.question}</div>
                                            <div className="md:w-1/2 text-slate-500 italic text-sm">R: {c.answer}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'library' && (
                            <div className="grid sm:grid-cols-2 gap-6">
                                {decks.map(d => (
                                    <div key={d.id} className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm hover:shadow-xl transition-all">
                                        <h3 className="text-2xl font-black mb-2">{d.title}</h3>
                                        <p className="text-xs text-slate-400 font-bold uppercase mb-6">{d.cards.length} flashcards</p>
                                        <button 
                                            onClick={() => { setCurrentDeck(d); setCardIndex(0); setView('study'); }}
                                            className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black hover:bg-indigo-600 transition"
                                        >
                                            Étudier
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'study' && currentDeck && (
                            <div className="flex flex-col items-center gap-8 max-w-lg mx-auto animate-in zoom-in-95 duration-300">
                                <div className="w-full flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <button onClick={() => setView('library')}>Quitter</button>
                                    <span>Carte {cardIndex + 1} / {currentDeck.cards.length}</span>
                                </div>
                                <div className="relative w-full h-[400px] perspective-1000 cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                                    <div className={`relative w-full h-full transition-transform duration-700 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                        <div className="absolute inset-0 bg-white rounded-[3rem] shadow-2xl border border-slate-100 flex flex-col items-center justify-center p-10 backface-hidden">
                                            <p className="text-2xl font-black leading-tight">{currentDeck.cards[cardIndex].question}</p>
                                        </div>
                                        <div className="absolute inset-0 bg-indigo-600 text-white rounded-[3rem] shadow-2xl flex flex-col items-center justify-center p-10 backface-hidden rotate-y-180">
                                            <p className="text-xl font-medium leading-relaxed">{currentDeck.cards[cardIndex].answer}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 w-full">
                                    <button onClick={() => {setCardIndex(Math.max(0, cardIndex-1)); setIsFlipped(false)}} className="flex-1 bg-white border-2 py-4 rounded-2xl font-bold">Précédent</button>
                                    <button onClick={() => {if(cardIndex < currentDeck.cards.length-1){setCardIndex(cardIndex+1); setIsFlipped(false)}else{setView('library')}}} className="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-black shadow-lg">Suivant</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
